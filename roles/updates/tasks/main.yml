---
# Updates role: full system update for Debian/Ubuntu and RHEL/Rocky

- name: Update apt cache and upgrade all packages on Debian/Ubuntu
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 0
  when: ansible_os_family == "Debian"
  tags: updates

- name: Remove unused packages (autoremove) on Debian/Ubuntu
  ansible.builtin.apt:
    autoremove: true
    purge: true
  when: ansible_os_family == "Debian"
  tags: updates

- name: Update all packages on RHEL/Rocky
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
  when: ansible_os_family == "RedHat"
  tags: updates

- name: Remove unused packages (autoremove) on RHEL/Rocky
  ansible.builtin.dnf:
    autoremove: true
  when: ansible_os_family == "RedHat"
  tags: updates

- name: Check if a reboot is required on Debian/Ubuntu
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: ansible_os_family == "Debian"
  tags: updates

- name: Notify if reboot is required
  ansible.builtin.debug:
    msg: "Reboot is required on {{ inventory_hostname }}"
  when:
    - ansible_os_family == "Debian"
    - reboot_required_file.stat.exists
  tags: updates
