---
# Docker role: install Docker CE, docker-compose-plugin, add user to docker group

- name: Install prerequisite packages for Docker on Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  tags: docker

- name: Create directory for Docker GPG key on Debian/Ubuntu
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == "Debian"
  tags: docker

- name: Add Docker official GPG key on Debian/Ubuntu
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == "Debian"
  tags: docker

- name: Set Docker architecture fact on Debian/Ubuntu
  ansible.builtin.set_fact:
    docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
  when: ansible_os_family == "Debian"
  tags: docker

- name: Add Docker apt repository on Debian/Ubuntu
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: ansible_os_family == "Debian"
  tags: docker

- name: Install Docker CE packages on Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  tags: docker

- name: Install prerequisite packages for Docker on RHEL/Rocky
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - ca-certificates
      - curl
    state: present
  when: ansible_os_family == "RedHat"
  tags: docker

- name: Add Docker repository on RHEL/Rocky
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
  when: ansible_os_family == "RedHat"
  tags: docker

- name: Install Docker CE packages on RHEL/Rocky
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_os_family == "RedHat"
  tags: docker

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  tags: docker

- name: Configure Docker daemon options
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags: docker

- name: Add user to the docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  tags: docker
