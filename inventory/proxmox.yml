---
plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
compose:
  ansible_host: >-
    proxmox_agent_interfaces | default([])
    | rejectattr('name', 'match', '^(lo|docker|veth|br-|virbr)')
    | map(attribute='ip-addresses') | flatten
    | selectattr('ip-address-type', 'eq', 'ipv4')
    | map(attribute='ip-address') | first | default(inventory_hostname)