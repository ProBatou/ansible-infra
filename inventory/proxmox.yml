---
plugin: community.proxmox.proxmox
url: "{{ lookup('env', 'PROXMOX_URL') }}"
user: "{{ lookup('env', 'PROXMOX_USER') }}"
password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
validate_certs: false
want_facts: true
nodes:
  - "{{ lookup('env', 'PROXMOX_NODE') }}"
groups:
  by_node: proxmox_node
  by_tag: proxmox_tags
filters:
  - qemu_enabled == true
  - "'debian' in (proxmox_ostype | default('') | lower)"
compose:
  ansible_host: proxmox_ipconfig0 | default('') | regex_search('ip=([0-9.]+)', '\1') | default([]) | first | default('')