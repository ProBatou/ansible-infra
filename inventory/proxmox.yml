---
plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
groups:
  by_node: proxmox_node
  by_tag: proxmox_tags
filters:
  - proxmox_status == 'running'
  - "'debian' in (proxmox_ostype | default('') | lower)"
compose:
  ansible_host: proxmox_agent_interfaces | default([]) | selectattr('name', 'ne', 'lo') | map(attribute='ip-addresses') | flatten | selectattr('ip-address-type', 'eq', 'ipv4') | map(attribute='ip-address') | first | default(inventory_hostname)