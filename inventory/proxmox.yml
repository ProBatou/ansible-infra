---
plugin: community.proxmox.proxmox

url: "{{ proxmox_url }}"
user: "{{ proxmox_user }}"
password: "{{ proxmox_password }}"

# Disable certificate validation for self-signed Proxmox certificates common in home-lab / private environments.
# Set to true and configure a trusted CA if your Proxmox host uses a valid certificate.
validate_certs: false
want_facts: true

# Group VMs automatically by their Proxmox node and by their tags
groups:
  by_node: proxmox_node
  by_tag: proxmox_tags

# Exclude templates — only include running/enabled QEMU VMs
filters:
  - qemu_enabled == true

# Set ansible_host to the VM's primary IPv4 address
compose:
  ansible_host: proxmox_ipconfig0 | default('') | regex_search('ip=([0-9.]+)', '\\1') | default([]) | first | default('')