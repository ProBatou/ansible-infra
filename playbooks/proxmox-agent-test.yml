---
- name: Test QEMU Guest Agent via Proxmox API
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    target_vm_name: "Hermes"

  tasks:
    - name: Find target VM
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
      register: vm_list

    - name: Extract VMID
      ansible.builtin.set_fact:
        target_vmid: >-
          {{
            (
              vm_list.json.data
              | selectattr('name', 'equalto', target_vm_name)
              | map(attribute='vmid')
              | list
              | first
            )
          }}

    - name: Show selected VM
      ansible.builtin.debug:
        msg: "Testing {{ target_vm_name }} (VMID {{ target_vmid }})"

    - name: Test QEMU Guest Agent
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ target_vmid }}/agent/ping"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
      register: agent_ping

    - name: Show Guest Agent result
      ansible.builtin.debug:
        var: agent_ping.json
