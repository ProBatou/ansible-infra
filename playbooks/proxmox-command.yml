---
- name: Select Proxmox QEMU virtual machines
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    proxmox_verify_ssl: "{{ (lookup('env', 'PROXMOX_VERIFY_SSL') | default('false', true)) | bool }}"
    target_selector: "{{ target_vms | default(target_vm | default('')) | trim }}"
    target_node_selector: "{{ target_node | default('all') | trim }}"

  tasks:
    - name: Validate command request
      ansible.builtin.assert:
        that:
          - guest_command is defined
          - guest_command | trim | length > 0
          - command_confirmation | default('') | trim == 'EXECUTE'
        fail_msg: "Set guest_command and confirm execution with command_confirmation=EXECUTE."

    - name: Select target VMs
      ansible.builtin.include_tasks: ../tasks/proxmox-select-qemu.yml

    - name: Show command execution plan
      ansible.builtin.debug:
        msg:
          target_node: "{{ target_node_selector }}"
          target: "{{ target_selector }}"
          virtual_machines: "{{ selected_vms | map(attribute='name') | list }}"
          command: "{{ guest_command }}"

- name: Execute command through Proxmox QEMU Guest Agent
  hosts: proxmox_targets
  gather_facts: false
  serial: "{{ command_serial | default(5) }}"
  become: false

  tasks:
    - name: Run requested command
      ansible.builtin.shell:
        cmd: "{{ guest_command }}"
      register: command_result
      changed_when: false

    - name: Show command result
      ansible.builtin.debug:
        msg:
          vm: "{{ display_vm_name | default(inventory_hostname) }}"
          vmid: "{{ proxmox_vmid }}"
          node: "{{ proxmox_node }}"
          rc: "{{ command_result.rc }}"
          stdout: "{{ command_result.stdout }}"
          stderr: "{{ command_result.stderr }}"
