---
- name: Refresh Semaphore Proxmox VM survey lists
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    proxmox_verify_ssl: "{{ (lookup('env', 'PROXMOX_VERIFY_SSL') | default('false', true)) | bool }}"
    semaphore_url: "{{ lookup('env', 'SEMAPHORE_URL') | default('http://127.0.0.1:3000', true) | regex_replace('/+$', '') }}"
    semaphore_api_token: "{{ lookup('env', 'SEMAPHORE_API_TOKEN') }}"
    semaphore_project_id: "{{ lookup('env', 'SEMAPHORE_PROJECT_ID') | default('2', true) }}"
    semaphore_survey_var_name: "{{ lookup('env', 'SEMAPHORE_TARGET_SURVEY_VAR') | default('target_vms', true) }}"
    semaphore_node_survey_var_name: "target_node"
    semaphore_excluded_proxmox_playbooks:
      - playbooks/proxmox-refresh-semaphore-vm-list.yml
      - playbooks/proxmox-test.yml

  tasks:
    - name: Validate configuration
      ansible.builtin.assert:
        that:
          - proxmox_host | length > 0
          - proxmox_token_id | length > 0
          - proxmox_token_secret | length > 0
          - "'!' in proxmox_token_id"
          - semaphore_api_token | length > 0
        fail_msg: "Missing Proxmox configuration or SEMAPHORE_API_TOKEN. PROXMOX_TOKEN_ID must use user@realm!token format."

    - name: Derive Proxmox API user and token name
      ansible.builtin.set_fact:
        proxmox_api_user: "{{ proxmox_token_id.split('!')[0] }}"
        proxmox_api_token_name: "{{ proxmox_token_id.split('!', 1)[1] }}"
      no_log: true

    - name: Query all QEMU virtual machines and configuration
      community.proxmox.proxmox_vm_info:
        api_host: "{{ proxmox_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_name }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        type: qemu
        config: current
        validate_certs: "{{ proxmox_verify_ssl }}"
      register: proxmox_info
      no_log: true

    - name: Initialize generated survey data
      ansible.builtin.set_fact:
        generated_vm_values:
          - {name: "Toutes les VM", value: "all"}
        generated_node_values:
          - {name: "Tout le cluster", value: "all"}
        generated_tags: []
        generated_nodes: "{{ proxmox_info.proxmox_vms | map(attribute='node') | unique | sort | list }}"

    - name: Add Proxmox nodes to node survey values
      ansible.builtin.set_fact:
        generated_node_values: "{{ generated_node_values + [{'name': item, 'value': item}] }}"
      loop: "{{ generated_nodes }}"

    - name: Collect Proxmox tags
      ansible.builtin.set_fact:
        generated_tags: >-
          {{ (generated_tags + (((item.tags | default(item.config.tags | default(''), true)) | string).split(';')))
             | map('trim') | reject('equalto', '') | unique | list }}
      loop: "{{ proxmox_info.proxmox_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add Proxmox tag groups to survey values
      ansible.builtin.set_fact:
        generated_vm_values: "{{ generated_vm_values + [{'name': 'Groupe: ' ~ item, 'value': 'tag:' ~ item}] }}"
      loop: "{{ generated_tags | sort }}"

    - name: Add VMID targets to generated survey values
      ansible.builtin.set_fact:
        generated_vm_values: >-
          {{ generated_vm_values + [{
            'name': item.name ~ ' [VMID ' ~ (item.vmid | string) ~ '] (' ~ item.node ~ ')',
            'value': 'vmid:' ~ (item.vmid | string)
          }] }}
      loop: "{{ proxmox_info.proxmox_vms | sort(attribute='name') }}"
      loop_control:
        label: "{{ item.name }} [VMID {{ item.vmid }}]"

    - name: Read Semaphore project templates
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/templates"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
          Accept: application/json
        return_content: true
        status_code: 200
      register: semaphore_templates
      no_log: true

    - name: Read full Semaphore template details
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/templates/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
          Accept: application/json
        return_content: true
        status_code: 200
      loop: "{{ semaphore_templates.json }}"
      loop_control:
        label: "{{ item.name }} ({{ item.id }})"
      register: semaphore_template_details
      no_log: true

    - name: Initialize matching template list
      ansible.builtin.set_fact:
        proxmox_target_templates: []

    - name: Select Proxmox guest templates
      ansible.builtin.set_fact:
        proxmox_target_templates: "{{ proxmox_target_templates + [item.json] }}"
      loop: "{{ semaphore_template_details.results }}"
      loop_control:
        label: "{{ item.json.name }}"
      vars:
        template_playbook: "{{ item.json.playbook | default('') }}"
        template_survey_names: "{{ item.json.survey_vars | default([]) | map(attribute='name') | list }}"
      when:
        - >-
          (semaphore_survey_var_name in template_survey_names)
          or
          (template_playbook.startswith('playbooks/proxmox-')
           and template_playbook not in semaphore_excluded_proxmox_playbooks)

    - name: Build refreshed node survey variable
      ansible.builtin.set_fact:
        refreshed_node_survey:
          name: "{{ semaphore_node_survey_var_name }}"
          title: "Nœud Proxmox"
          description: "Limiter l'action à un nœud du cluster ou utiliser tout le cluster."
          required: true
          type: enum
          values: "{{ generated_node_values }}"
          default_value: "all"

    - name: Build refreshed target survey variable
      ansible.builtin.set_fact:
        refreshed_target_survey:
          name: "{{ semaphore_survey_var_name }}"
          title: "Cible"
          description: "VM identifiée par VMID ou groupe Proxmox. La sélection est filtrée par le nœud choisi."
          required: true
          type: enum
          values: "{{ generated_vm_values }}"
          default_value: ""

    - name: Refresh Proxmox surveys on matching templates
      ansible.builtin.include_tasks: ../tasks/semaphore-refresh-proxmox-template.yml
      loop: "{{ proxmox_target_templates }}"
      loop_control:
        loop_var: target_template
        label: "{{ target_template.name }} ({{ target_template.id }})"

    - name: Show refresh result
      ansible.builtin.debug:
        msg:
          templates: "{{ proxmox_target_templates | map(attribute='name') | list }}"
          template_count: "{{ proxmox_target_templates | length }}"
          nodes: "{{ generated_nodes }}"
          node_choices: "{{ generated_node_values | map(attribute='value') | list }}"
          vm_count: "{{ proxmox_info.proxmox_vms | length }}"
          tag_count: "{{ generated_tags | length }}"
          tags: "{{ generated_tags | sort }}"
