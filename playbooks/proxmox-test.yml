---
- name: Discover Proxmox QEMU virtual machines
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_node: "{{ lookup('env', 'PROXMOX_NODE') | default('', true) }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    proxmox_verify_ssl: "{{ (lookup('env', 'PROXMOX_VERIFY_SSL') | default('false', true)) | bool }}"

  tasks:
    - name: Validate Proxmox API configuration
      ansible.builtin.assert:
        that:
          - proxmox_host | length > 0
          - proxmox_token_id | length > 0
          - proxmox_token_secret | length > 0
        fail_msg: "Missing PROXMOX_HOST, PROXMOX_TOKEN_ID or PROXMOX_TOKEN_SECRET."

    - name: Query QEMU virtual machines
      community.proxmox.proxmox_vm_info:
        api_host: "{{ proxmox_host }}"
        api_token_id: "{{ proxmox_token_id }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        node: "{{ proxmox_node if proxmox_node | length > 0 else omit }}"
        type: qemu
        config: current
        validate_certs: "{{ proxmox_verify_ssl }}"
      register: proxmox_info
      no_log: true

    - name: Show discovered virtual machines
      ansible.builtin.debug:
        msg: >-
          {{ proxmox_info.proxmox_vms
             | sort(attribute='vmid')
             | map(attribute='name')
             | list }}

    - name: Show discovery summary
      ansible.builtin.debug:
        msg: "Discovered {{ proxmox_info.proxmox_vms | length }} QEMU VM(s)."
