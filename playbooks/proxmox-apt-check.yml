---
- name: Check Debian updates through Proxmox QEMU Guest Agent
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"

  tasks:
    - name: Validate target VM was provided
      ansible.builtin.assert:
        that:
          - target_vm is defined
          - target_vm | trim | length > 0
        fail_msg: "Provide target_vm from the Semaphore template survey."

    - name: Set target VM name
      ansible.builtin.set_fact:
        target_vm_name: "{{ target_vm | trim }}"

    - name: Find target VM
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
      register: vm_list
      no_log: true

    - name: Extract matching VM IDs
      ansible.builtin.set_fact:
        matching_vmids: >-
          {{
            vm_list.json.data
            | selectattr('name', 'equalto', target_vm_name)
            | map(attribute='vmid')
            | list
          }}

    - name: Validate target VM exists uniquely
      ansible.builtin.assert:
        that:
          - matching_vmids | length == 1
        fail_msg: "VM '{{ target_vm_name }}' was not found uniquely on {{ proxmox_node }}."

    - name: Extract VMID
      ansible.builtin.set_fact:
        target_vmid: "{{ matching_vmids | first }}"

    - name: Start apt update and count available upgrades
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ target_vmid }}/agent/exec"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        body_format: form-urlencoded
        body:
          command:
            - "/bin/sh"
            - "-lc"
            - >-
              set -eu;
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update >/tmp/semaphore-apt-update.log 2>&1;
              COUNT="$(apt list --upgradable 2>/dev/null | sed '1d' | sed '/^$/d' | wc -l)";
              printf 'HOSTNAME=%s\n' "$(hostname)";
              printf 'UPGRADABLE=%s\n' "$COUNT";
              if [ -e /var/run/reboot-required ]; then
                printf 'REBOOT_REQUIRED=yes\n';
              else
                printf 'REBOOT_REQUIRED=no\n';
              fi
        validate_certs: false
        return_content: true
        status_code: 200
      register: guest_exec_start
      no_log: true

    - name: Extract guest-exec PID
      ansible.builtin.set_fact:
        guest_exec_pid: "{{ guest_exec_start.json.data.pid }}"

    - name: Wait for apt check to finish
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ target_vmid }}/agent/exec-status?pid={{ guest_exec_pid }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: guest_exec_status
      until: (guest_exec_status.json.data.exited | default(0) | int) == 1
      retries: 120
      delay: 1
      no_log: true

    - name: Fail if apt check failed
      ansible.builtin.assert:
        that:
          - (guest_exec_status.json.data.exitcode | int) == 0
        fail_msg: >-
          apt check failed inside {{ target_vm_name }}:
          {{ guest_exec_status.json.data['err-data'] | default('no stderr returned') }}

    - name: Show update status
      ansible.builtin.debug:
        msg:
          vm: "{{ target_vm_name }}"
          vmid: "{{ target_vmid }}"
          result: "{{ guest_exec_status.json.data['out-data'] | default('') }}"
