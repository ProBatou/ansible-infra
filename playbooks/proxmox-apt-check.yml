---
- name: Check Debian updates through Proxmox QEMU Guest Agent
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    proxmox_verify_ssl: "{{ (lookup('env', 'PROXMOX_VERIFY_SSL') | default('false', true)) | bool }}"

  tasks:
    - name: Query QEMU virtual machines
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_verify_ssl }}"
        return_content: true
        status_code: 200
      register: vm_list
      no_log: true

    - name: Validate at least one VM exists
      ansible.builtin.assert:
        that:
          - vm_list.json.data | length > 0
        fail_msg: "No QEMU VM found on node {{ proxmox_node }}."

    - name: Select requested VM or first VM by VMID
      ansible.builtin.set_fact:
        selected_vm: >-
          {{
            ((vm_list.json.data | selectattr('name', 'equalto', target_vm) | list | first)
              if (target_vm is defined and target_vm | trim | length > 0)
              else (vm_list.json.data | sort(attribute='vmid') | first))
          }}

    - name: Start apt update and count available upgrades
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ selected_vm.vmid }}/agent/exec"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        body_format: form-urlencoded
        body:
          command:
            - "/bin/sh"
            - "-lc"
            - >-
              set -eu;
              if ! command -v apt-get >/dev/null 2>&1; then
                printf 'ERROR=apt-get-not-found\n';
                exit 20;
              fi;
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update >/tmp/semaphore-apt-update.log 2>&1;
              COUNT="$(apt list --upgradable 2>/dev/null | sed '1d' | sed '/^$/d' | wc -l)";
              printf 'HOSTNAME=%s\n' "$(hostname)";
              printf 'UPGRADABLE=%s\n' "$COUNT";
              if [ -e /var/run/reboot-required ]; then
                printf 'REBOOT_REQUIRED=yes\n';
              else
                printf 'REBOOT_REQUIRED=no\n';
              fi
        validate_certs: "{{ proxmox_verify_ssl }}"
        return_content: true
        status_code: 200
      register: guest_exec_start
      no_log: true

    - name: Extract guest-exec PID
      ansible.builtin.set_fact:
        guest_exec_pid: "{{ guest_exec_start.json.data.pid }}"

    - name: Wait for apt check to finish
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ selected_vm.vmid }}/agent/exec-status?pid={{ guest_exec_pid }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_verify_ssl }}"
        return_content: true
        status_code: 200
      register: guest_exec_status
      until: (guest_exec_status.json.data.exited | default(0) | int) == 1
      retries: 120
      delay: 1
      no_log: true

    - name: Fail if apt check failed
      ansible.builtin.assert:
        that:
          - (guest_exec_status.json.data.exitcode | int) == 0
        fail_msg: >-
          APT check failed inside {{ selected_vm.name }}:
          {{ guest_exec_status.json.data['err-data'] | default(guest_exec_status.json.data['out-data'] | default('no output returned')) }}

    - name: Show update status
      ansible.builtin.debug:
        msg:
          vm: "{{ selected_vm.name }}"
          vmid: "{{ selected_vm.vmid }}"
          result: "{{ guest_exec_status.json.data['out-data'] | default('') }}"
