---
- name: Bootstrap SSH automation key via Proxmox QEMU Guest Agent
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    proxmox_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    target_vm_name: "Hermes"
    deploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIISLKXEK3x6iQg6+StMuFcifSY6AsDyc5FPMIwQigJ6t semaphore-automation"

  tasks:
    - name: Find target VM
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
      register: vm_list
      no_log: true

    - name: Extract VMID
      ansible.builtin.set_fact:
        target_vmid: >-
          {{
            (
              vm_list.json.data
              | selectattr('name', 'equalto', target_vm_name)
              | map(attribute='vmid')
              | list
              | first
            )
          }}

    - name: Inject semaphore-automation public key through QEMU Guest Agent
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ target_vmid }}/agent/exec"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        body_format: form-urlencoded
        body:
          command:
            - "/bin/sh"
            - "-lc"
            - >-
              set -eu;
              umask 077;
              mkdir -p /root/.ssh;
              chmod 700 /root/.ssh;
              touch /root/.ssh/authorized_keys;
              chmod 600 /root/.ssh/authorized_keys;
              KEY='{{ deploy_public_key }}';
              if grep -qxF "$KEY" /root/.ssh/authorized_keys; then
                printf 'STATUS=already_present\n';
              else
                printf '%s\n' "$KEY" >> /root/.ssh/authorized_keys;
                printf 'STATUS=added\n';
              fi;
              printf 'TARGET=%s\n' "$(hostname)"
        validate_certs: false
        return_content: true
        status_code: 200
      register: guest_exec_start
      no_log: true

    - name: Extract guest-exec PID
      ansible.builtin.set_fact:
        guest_exec_pid: "{{ guest_exec_start.json.data.pid }}"

    - name: Wait for bootstrap command to finish
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ target_vmid }}/agent/exec-status?pid={{ guest_exec_pid }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: guest_exec_status
      until: (guest_exec_status.json.data.exited | default(0) | int) == 1
      retries: 15
      delay: 1
      no_log: true

    - name: Fail if bootstrap command failed
      ansible.builtin.assert:
        that:
          - (guest_exec_status.json.data.exitcode | int) == 0
        fail_msg: "SSH bootstrap failed inside {{ target_vm_name }}."

    - name: Show bootstrap result
      ansible.builtin.debug:
        msg:
          vm: "{{ target_vm_name }}"
          vmid: "{{ target_vmid }}"
          stdout: "{{ guest_exec_status.json.data['out-data'] | default('') }}"
