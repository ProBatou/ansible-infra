---
- name: Validate Proxmox API configuration
  ansible.builtin.assert:
    that:
      - proxmox_host | length > 0
      - proxmox_token_id | length > 0
      - proxmox_token_secret | length > 0
      - "'!' in proxmox_token_id"
    fail_msg: "Missing or invalid PROXMOX_HOST, PROXMOX_TOKEN_ID or PROXMOX_TOKEN_SECRET. PROXMOX_TOKEN_ID must use user@realm!token format."

- name: Derive Proxmox API user and token name
  ansible.builtin.set_fact:
    proxmox_api_user: "{{ proxmox_token_id.split('!', 1)[0] }}"
    proxmox_api_token_name: "{{ proxmox_token_id.split('!', 1)[1] }}"
  no_log: true

- name: Query QEMU virtual machines and configuration
  community.proxmox.proxmox_vm_info:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_name }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    type: qemu
    config: current
    validate_certs: "{{ proxmox_verify_ssl }}"
  register: proxmox_info
  no_log: true

- name: Validate target selector
  ansible.builtin.assert:
    that:
      - target_selector | length > 0
    fail_msg: "Set target_vms to vmid:<id>, tag:<tag>, or all."

- name: Normalize node selector
  ansible.builtin.set_fact:
    effective_node_selector: >-
      {{ (target_node_selector | default('all') | trim) if (target_node_selector | default('') | trim | length > 0) else 'all' }}

- name: Build node candidate list
  ansible.builtin.set_fact:
    candidate_vms: >-
      {{ proxmox_info.proxmox_vms if effective_node_selector | lower == 'all'
         else (proxmox_info.proxmox_vms | selectattr('node', 'equalto', effective_node_selector) | list) }}

- name: Select all virtual machines
  ansible.builtin.set_fact:
    selected_vms: "{{ candidate_vms }}"
  when: target_selector | lower == 'all'

- name: Select virtual machines by Proxmox tag
  when: target_selector | lower is match('^tag:')
  block:
    - name: Initialize tag selection
      ansible.builtin.set_fact:
        selected_vms: []

    - name: Match candidate virtual machines by tag
      ansible.builtin.set_fact:
        selected_vms: "{{ selected_vms + [item] }}"
      vars:
        vm_tags: >-
          {{ (((item.tags | default(item.config.tags | default(''), true)) | string).split(';'))
             | map('trim') | reject('equalto', '') | list }}
        wanted_tag: "{{ target_selector[4:] | trim }}"
      loop: "{{ candidate_vms }}"
      loop_control:
        label: "{{ item.name }} [VMID {{ item.vmid }}]"
      when: wanted_tag in vm_tags

- name: Select virtual machine by VMID
  ansible.builtin.set_fact:
    selected_vms: >-
      {{ candidate_vms
         | selectattr('vmid', 'equalto', target_selector[5:] | int)
         | list }}
  when: target_selector | lower is match('^vmid:[0-9]+$')

- name: Reject unsupported target selector
  ansible.builtin.assert:
    that:
      - target_selector | lower == 'all' or target_selector | lower is match('^tag:') or target_selector | lower is match('^vmid:[0-9]+$')
    fail_msg: "Unsupported target '{{ target_selector }}'. Use vmid:<id>, tag:<tag>, or all."

- name: Validate selected virtual machines
  ansible.builtin.assert:
    that:
      - selected_vms | default([]) | length > 0
    fail_msg: "No QEMU VM matches selector '{{ target_selector }}' on node '{{ effective_node_selector }}'."

- name: Add selected VMs to temporary Ansible inventory
  ansible.builtin.add_host:
    name: "{{ item.name }}-vmid-{{ item.vmid }}"
    groups: proxmox_targets
    display_vm_name: "{{ item.name }}"
    ansible_connection: community.proxmox.proxmox_qemu_api
    proxmox_vmid: "{{ item.vmid }}"
    proxmox_node: "{{ item.node }}"
    proxmox_api_host: "{{ proxmox_host }}"
    proxmox_api_token_id: "{{ proxmox_token_id }}"
    proxmox_api_token_secret: "{{ proxmox_token_secret }}"
    proxmox_validate_certs: "{{ proxmox_verify_ssl }}"
  loop: "{{ selected_vms }}"
  loop_control:
    label: "{{ item.name }} [VMID {{ item.vmid }}] ({{ item.node }})"
  no_log: true

- name: Show selected VMs
  ansible.builtin.debug:
    msg: >-
      Selected on {{ effective_node_selector }}:
      {{ selected_vms | map(attribute='name') | zip(selected_vms | map(attribute='vmid')) | map('join', ' [VMID ') | map('regex_replace', '$', ']') | list | join(', ') }}
