---
# Common variables applied to all hosts

ansible_user: ansible
ansible_python_interpreter: /usr/bin/python3

ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org

base_packages:
  - vim
  - curl
  - git
  - htop

# Proxmox dynamic inventory variables — set per environment.
# proxmox_password must be stored in Semaphore Variable Groups or ansible-vault.